[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nxmanager"
version = "0.1.0"
description = "A native-feeling PySide6 front end for NX Native on Apple Silicon macOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
macos = ["pyobjc-framework-Cocoa>=10", "pyobjc-framework-GameController>=10"]
test = ["pytest>=8"]

[project.scripts]
nxmanager = "nxmanager.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nxmanager*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
